[project]
name = "fprime-tui"
version = "0.1.0"
description = "Terminal User Interface for NASA F' Flight Software Framework"
authors = [
    { name = "JPL Mission Control Team" }
]
requires-python = ">=3.9"
dependencies = [
    "textual>=0.85.2",
    "rich>=13.7.1",
    "ollama>=0.4.7",
    "httpx>=0.27.0",
    "aiofiles>=23.2.1",
]

[tool.ruff]
# Target Python version
target-version = "py39"

# Exclude common directories
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pycache__",
    "build-fprime-automatic-native",
    "FPrimeSampleProject",
    "TUI/rag/raw",
]

line-length = 120

[tool.ruff.lint]
# Select rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C90", # mccabe complexity
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501", # Line too long (already handled by line-length)
    "B008", # Do not perform function calls in argument defaults (Textual uses this)
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "venv/",
    "FPrimeSampleProject/",
    "TUI/rag/raw/",
]
